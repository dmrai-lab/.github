name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests -q
  guards:
    uses: ./.github/workflows/guards.yml
    with:
      src: guards
      workflows: .github/workflows/ci.yml .github/workflows/integration.yml
  integration:
    # no calling package: the mains of all five, at this repository's workflow and smoke set
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ github.sha }}
