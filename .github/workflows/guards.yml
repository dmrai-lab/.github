name: Guards

# The static guards of this repository's `guards/` package, called by every public repository:
#   jobs:
#     guards:
#       uses: dmrai-lab/.github/.github/workflows/guards.yml@main
#       with: {runner: '["self-hosted", "linux"]'}
# Stdlib-only Python, seconds on a free runner; no schedule. The guards are read from `ref` of this repository
# (default main; a workflow called from here passes its own commit).
on:
  workflow_call:
    inputs:
      src:
        description: "Space-separated package paths for the AST guards (default: detected packages)"
        type: string
        default: ""
      workflows:
        description: "Space-separated workflow files that collect the tests"
        type: string
        default: ".github/workflows/tests.yml"
      ref:
        description: "The ref of dmrai-lab/.github whose guards/ package is run"
        type: string
        default: main
      runner:
        description: "JSON for the job's runner: a label, a list of labels, or an object with group and labels"
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    steps:
      - name: Remove stale package checkouts
        run: rm -rf -- "$GITHUB_WORKSPACE/packages"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dmrai-lab/.github
          ref: ${{ inputs.ref }}
          path: .guards-src
          sparse-checkout: guards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the guards
        env:
          GUARDS_SRC: ${{ inputs.src }}
          GUARDS_WORKFLOWS: ${{ inputs.workflows }}
          # The calling repository's visibility, from the event the host delivered (not an input or a variable, so a
          # public repository cannot claim to be private). The private-ids guard is off for a private repository only;
          # when the event carries no repository, the value is empty and every guard runs.
          GUARDS_REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          visibility=public
          if [ "$GUARDS_REPO_PRIVATE" = "true" ]; then visibility=private; fi
          PYTHONPATH=.guards-src python -m guards all . --src "$GUARDS_SRC" --workflows "$GUARDS_WORKFLOWS" --repo-visibility "$visibility"
